# Netlify Configuration for TeddyPups U.A.E. Static Site

[build]
  publish = "."

# Redirect Next.js image optimizer requests to direct static assets
[[redirects]]
  from = "/_next/image"
  query = { url = ":url" }
  to = "/:url"
  status = 302

# Pretty URL routing for primary pages
[[redirects]]
  from = "/puppies"
  to = "/puppies/index.html"
  status = 200

[[redirects]]
  from = "/happy-families"
  to = "/happy-families/index.html"
  status = 200

[[redirects]]
  from = "/how-it-works"
  to = "/how-it-works/index.html"
  status = 200

[[redirects]]
  from = "/faq"
  to = "/faq/index.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact/index.html"
  status = 200

[[redirects]]
  from = "/gone-home"
  to = "/gone-home/index.html"
  status = 200

# Pretty URLs for puppy profile detail routes
[[redirects]]
  from = "/puppies/:slug"
  to = "/puppies/:slug/index.html"
  status = 200

# Security and caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

